<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Trading Grid Context Services</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .box { width: min(420px, 100%); background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--blue); border-radius: var(--r-md); padding: 28px; box-shadow: var(--shadow); }
  .box img { height: 24px; }
  .box h1 { font-size: 20px; margin: 18px 0 4px; }
  .box p { color: var(--slate); margin: 0 0 18px; }
  .box input { width: 100%; margin-bottom: 12px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap"><form class="box" id="f">
  <img src="/assets/opentext-logo.svg" alt="OpenText">
  <h1>Trading Grid Context Services</h1>
  <p>Prototype console. Enter the access password.</p>
  <input class="input" type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
  <div class="err" id="err"></div>
  <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
</form></div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.href = "/"; else document.getElementById("err").textContent = "Incorrect password. Re-enter the password.";
});
</script>
</body>
</html>
